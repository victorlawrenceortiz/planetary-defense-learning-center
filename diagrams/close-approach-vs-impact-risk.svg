<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-label="Close Approach vs. Impact Risk">
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#05070d"/><stop offset="1" stop-color="#0c1530"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63d2ff"/></marker></defs>
<rect width="1400" height="850" fill="url(#bg)"/><g opacity="0.35" stroke="#1b2a4d"><path d="M0 100h1400M0 200h1400M0 300h1400M0 400h1400M0 500h1400M0 600h1400M0 700h1400M100 0v850M200 0v850M300 0v850M400 0v850M500 0v850M600 0v850M700 0v850M800 0v850M900 0v850M1000 0v850M1100 0v850M1200 0v850M1300 0v850"/></g>
<text x="70" y="78" fill="#8fe9ff" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="900">Close Approach vs. Impact Risk</text><text x="70" y="116" fill="#d7e3ff" font-family="Segoe UI, Arial, sans-serif" font-size="20">Close approach is not the same as impact prediction.</text>
<g font-family="Segoe UI, Arial, sans-serif"><path d="M470 255 L520 255" stroke="#63d2ff" stroke-width="4" marker-end="url(#arrow)"/><text x="460.0" y="245.0" fill="#91a8d6" font-size="14">context</text><path d="M880 255 L930 255" stroke="#63d2ff" stroke-width="4" marker-end="url(#arrow)"/><text x="870.0" y="245.0" fill="#91a8d6" font-size="14">model</text><path d="M675 320 L420 500" stroke="#63d2ff" stroke-width="4" marker-end="url(#arrow)"/><text x="512.5" y="400.0" fill="#91a8d6" font-size="14">most cases</text><path d="M1110 320 L980 500" stroke="#63d2ff" stroke-width="4" marker-end="url(#arrow)"/><text x="1010.0" y="400.0" fill="#91a8d6" font-size="14">rare cases</text><g id="close"><rect x="110" y="190" width="360" height="130" rx="16" fill="#0d1426" stroke="#63d2ff" stroke-width="2"/><text x="128" y="222" fill="#e8fbff" font-size="22" font-weight="800">Close Approach</text><text x="128" y="252" fill="#b8caec" font-size="16">Object passes near Earth in space terms</text></g><g id="riskfactors"><rect x="520" y="190" width="360" height="130" rx="16" fill="#0d1426" stroke="#ffbc42" stroke-width="2"/><text x="538" y="222" fill="#e8fbff" font-size="22" font-weight="800">Risk Factors</text><text x="538" y="252" fill="#b8caec" font-size="16">Size · distance · speed · uncertainty</text></g><g id="prob"><rect x="930" y="190" width="360" height="130" rx="16" fill="#0d1426" stroke="#fb7185" stroke-width="2"/><text x="948" y="222" fill="#e8fbff" font-size="22" font-weight="800">Impact Probability</text><text x="948" y="252" fill="#b8caec" font-size="16">Calculated chance, often near zero</text></g><g id="routine"><rect x="250" y="500" width="340" height="120" rx="16" fill="#0d1426" stroke="#53f28c" stroke-width="2"/><text x="268" y="532" fill="#e8fbff" font-size="22" font-weight="800">Routine Event</text><text x="268" y="562" fill="#b8caec" font-size="16">Most close approaches are scientific tracking events</text></g><g id="attention"><rect x="810" y="500" width="340" height="120" rx="16" fill="#0d1426" stroke="#ffbc42" stroke-width="2"/><text x="828" y="532" fill="#e8fbff" font-size="22" font-weight="800">Needs Attention</text><text x="828" y="562" fill="#b8caec" font-size="16">Only if evidence and official sources support concern</text></g></g>
<text x="70" y="805" fill="#91a8d6" font-family="Segoe UI, Arial, sans-serif" font-size="18">TESS - Planetary Defense Foundation · Public education diagram</text>
</svg>