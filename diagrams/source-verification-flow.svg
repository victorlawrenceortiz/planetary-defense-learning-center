<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-label="Source Verification Flow">
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#05070d"/><stop offset="1" stop-color="#0c1530"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63d2ff"/></marker></defs>
<rect width="1400" height="850" fill="url(#bg)"/><g opacity="0.35" stroke="#1b2a4d"><path d="M0 100h1400M0 200h1400M0 300h1400M0 400h1400M0 500h1400M0 600h1400M0 700h1400M100 0v850M200 0v850M300 0v850M400 0v850M500 0v850M600 0v850M700 0v850M800 0v850M900 0v850M1000 0v850M1100 0v850M1200 0v850M1300 0v850"/></g>
<text x="70" y="78" fill="#8fe9ff" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="900">Source Verification Flow</text><text x="70" y="116" fill="#d7e3ff" font-family="Segoe UI, Arial, sans-serif" font-size="20">A calm checklist before sharing planetary-defense or emergency information.</text>
<g font-family="Segoe UI, Arial, sans-serif"><path d="M340 230 L410 230" stroke="#63d2ff" stroke-width="4" marker-end="url(#arrow)"/><text x="340.0" y="220.0" fill="#91a8d6" font-size="14">verify</text><path d="M670 230 L740 230" stroke="#63d2ff" stroke-width="4" marker-end="url(#arrow)"/><text x="670.0" y="220.0" fill="#91a8d6" font-size="14">interpret</text><path d="M1000 230 L1070 230" stroke="#63d2ff" stroke-width="4" marker-end="url(#arrow)"/><text x="1000.0" y="220.0" fill="#91a8d6" font-size="14">tone</text><path d="M1190 280 L490 460" stroke="#63d2ff" stroke-width="4" marker-end="url(#arrow)"/><text x="805.0" y="360.0" fill="#91a8d6" font-size="14">verified</text><path d="M870 280 L910 460" stroke="#63d2ff" stroke-width="4" marker-end="url(#arrow)"/><text x="855.0" y="360.0" fill="#91a8d6" font-size="14">unclear</text><g id="claim"><rect x="80" y="180" width="260" height="100" rx="16" fill="#0d1426" stroke="#ffbc42" stroke-width="2"/><text x="98" y="212" fill="#e8fbff" font-size="22" font-weight="800">Claim Found</text><text x="98" y="242" fill="#b8caec" font-size="16">Post, alert, article, rumor</text></g><g id="source"><rect x="410" y="180" width="260" height="100" rx="16" fill="#0d1426" stroke="#63d2ff" stroke-width="2"/><text x="428" y="212" fill="#e8fbff" font-size="22" font-weight="800">Check Source</text><text x="428" y="242" fill="#b8caec" font-size="16">Official? timestamped?</text></g><g id="meaning"><rect x="740" y="180" width="260" height="100" rx="16" fill="#0d1426" stroke="#63d2ff" stroke-width="2"/><text x="758" y="212" fill="#e8fbff" font-size="22" font-weight="800">Check Meaning</text><text x="758" y="242" fill="#b8caec" font-size="16">Close approach vs impact</text></g><g id="wording"><rect x="1070" y="180" width="260" height="100" rx="16" fill="#0d1426" stroke="#63d2ff" stroke-width="2"/><text x="1088" y="212" fill="#e8fbff" font-size="22" font-weight="800">Check Wording</text><text x="1088" y="242" fill="#b8caec" font-size="16">No panic language</text></g><g id="share"><rect x="340" y="460" width="300" height="110" rx="16" fill="#0d1426" stroke="#53f28c" stroke-width="2"/><text x="358" y="492" fill="#e8fbff" font-size="22" font-weight="800">Share Carefully</text><text x="358" y="522" fill="#b8caec" font-size="16">Link official source</text></g><g id="hold"><rect x="760" y="460" width="300" height="110" rx="16" fill="#0d1426" stroke="#fb7185" stroke-width="2"/><text x="778" y="492" fill="#e8fbff" font-size="22" font-weight="800">If Unsure</text><text x="778" y="522" fill="#b8caec" font-size="16">Do not amplify</text></g></g>
<text x="70" y="805" fill="#91a8d6" font-family="Segoe UI, Arial, sans-serif" font-size="18">TESS - Planetary Defense Foundation · Public education diagram</text>
</svg>